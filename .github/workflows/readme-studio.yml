# Redraws the README Studio cards in assets/ from readme-studio.json.
# Generated by README Studio. README.md itself is never changed.
name: Update README cards

on:
  schedule:
    - cron: "19 5 * * *" # every day, 05:19 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-studio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Redraw cards
        run: node .github/readme-studio/render.mjs readme-studio.json
        env:
          # Public data works with the built-in token. Add a README_STUDIO_TOKEN
          # secret (a personal access token) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.README_STUDIO_TOKEN || github.token }}

      - name: Commit changed cards
        run: |
          git add -- "assets"
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update README cards"
          git push
